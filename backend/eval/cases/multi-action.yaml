# 2026-07-04 真实翻车对话（T45 立项现场）：
# 复合指令"删粽子 + 记葱花饼"被单意图协议缝合成一个 modify——
# "无油"安到了粽子头上（粽子→粽子（无油）重估）、删除丢失、葱花饼没记。
name: 复合动作 multi——删一条+记一条（2026-07-04 真实翻车对话，T45）
turns:
  - say: "早上吃了50克粽子"
    expect:
      intent: record
      db:
        food_record: { where: { food_name: "粽子" }, meal_type: breakfast, weight_g: 50 }
        food_record_count: 1

  # 两个动作各自执行：删除免确认直接执行（T49，粽子当场消失），葱花饼直接入库；
  # "无油"必须跟着葱花饼走，不能污染粽子
  - say: "把刚才吃的粽子删除了，我记得早晨还吃了30克葱花饼，无油的"
    expect:
      intent: multi
      db:
        food_record: { where: { food_name: "葱花饼" }, meal_type: breakfast, weight_g: 30 }
        food_record_count: 1
        pending_record: null
