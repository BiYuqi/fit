# 2026-07-03 outoftoken 真实案例：葱花饼修正闭环
# 曾暴露的缺陷：修正表达无协议可落地（T40，已修）、只读路径谎称已更新（T39，已修）、纠正不沉淀（T37，已修）
name: 葱花饼修正闭环（outoftoken 真实案例）
turns:
  # T42 已修：模型偶发返回 chosen_label=custom 但 portions 无 custom 条目，
  # 曾被回退成小份80g；现由 schema 层 ensureChosenPortion 归一化，明示克数必须原样入库
  - say: "晚上吃了100克葱花饼 煎的"
    expect:
      intent: record
      db:
        food_record: { weight_g: 100, meal_type: dinner }

  # "无油款"是影响营养口径的属性修正，触发 modify.update change.food_desc 重估（T40）。
  # 必须断言热量真的降了（< 267），不能只看 intent——曾经的回归：matchFood 弱匹配裁决
  # 把"葱花饼（无油）"错误裁给原条目，calories 原样 267，修正表面成功、数据静默没变。
  - say: "无油款"
    expect:
      intent: modify
      db:
        food_record: { where: { food_name: "葱花饼" }, calories: { lt: 267 } }

  # 用户解释性质疑：chat 或 discuss 都算合理路由
  - say: "我说我吃的葱花饼不是用油煎的，你热量算高了吧"
    expect:
      intent: [chat, discuss]
      reply_forbid: ["已更新", "已修改"]

  # 纯口感描述不是营养修正（T40 反面用例）：不该新建记录、不该动已有记录
  - say: "有点咸"
    expect:
      intent: chat
      db:
        food_record_count: 1

  # 核心场景：modify.update change.calories，用户真值直接落库 180（T40）
  - say: "记录成180kcal"
    expect:
      intent: modify
      db:
        food_record: { where: { food_name: "葱花饼" }, calories: 180 }
      reply_forbid: ["已更新(?![\\s\\S]*180)"]

  # 上一轮真改成功后，这里必须答修正后的数字。
  # 注意必须配落库断言：AI 会从 L0 鹦鹉学舌"180"，但库里仍是 267——嘴对账不对也是缺陷
  - say: "今晚都吃了啥"
    expect:
      intent: query
      reply_contain: ["180"]
      db:
        food_record: { where: { food_name: "葱花饼" }, calories: 180 }

  # 续报：餐次继承晚餐；克数明确应自动入库
  - say: "晚饭再加80克鸡蛋葱花煎饼"
    expect:
      intent: [record, modify]
      db:
        food_record: { weight_g: 80, meal_type: dinner }
